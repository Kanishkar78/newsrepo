<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Details — PulseNews</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0e17">

  <!-- Theme Detection & FOUC Prevention -->
  <script>
    (function() {
      var saved = localStorage.getItem('pulsenews_theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#0a0e17');
    })();
  </script>

  <!-- Auth Guard: Redirect unauthenticated visitors to /login -->
  <script>
    (function() {
      if (!localStorage.getItem('pulsenews_token')) {
        var current = window.location.pathname + window.location.search;
        window.location.replace('/login?redirect=' + encodeURIComponent(current));
      }
    })();
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Glass Header -->
  <header class="header">
    <div class="header-container">
      <a href="/" class="brand-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
            <path d="M18 14h-8"></path>
            <path d="M15 18h-5"></path>
            <path d="M10 6h8v4h-8z"></path>
          </svg>
        </div>
        <span>Pulse<span>News</span></span>
      </a>

      <!-- User Profile / Auth Pill -->
      <div id="header-user-container" class="header-user-container"></div>

      <!-- Theme Switcher (Light / Dark Mode) -->
      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Switch to Light Mode" title="Switch to Light Mode">
        <!-- Sun Icon (for dark mode) -->
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (for light mode) -->
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="article-detail-container" id="article-detail-container">
      <div class="article-top-nav">
        <a href="/" class="back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to All Articles
        </a>
        <button id="translate-article-btn" class="translate-article-btn" style="display: none;" title="Translate article content to common English">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 8 6 6"></path>
            <path d="m4 14 6-6 2-3"></path>
            <path d="M2 5h12"></path>
            <path d="M7 2h1"></path>
            <path d="m22 22-5-10-5 10"></path>
            <path d="M14 18h6"></path>
          </svg>
          <span class="translate-btn-text">Translate to English</span>
        </button>
      </div>

      <!-- Article Shell Skeleton / Content Injection Area -->
      <div id="article-content-wrapper">
        <div class="skeleton-card" style="height: 600px;">
          <div class="skeleton-body">
            <div class="skeleton-title" style="height: 40px; width: 90%;"></div>
            <div class="skeleton-text" style="height: 300px;"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <p>© 2026 PulseNews Media. All rights reserved.</p>
    </div>
  </footer>

  <!-- Modular Scripts -->
  <script src="/js/theme.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/article.js"></script>
</body>
</html>
