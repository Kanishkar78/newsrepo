<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pulseGrad)" />
  
  <!-- Outer Subtle Border Highlight -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Newspaper / Pulse Wave Icon -->
  <g filter="url(#shadow)" transform="translate(10, 10)">
    <!-- Folded Newspaper Body -->
    <path d="M7 38h27a4 4 0 0 0 4-4V6a4 4 0 0 0-4-4H15a4 4 0 0 0-4 4v28a4 4 0 0 1-4 4Zm0 0a4 4 0 0 1-4-4v-16c0-2.2 1.8-4 4-4h4" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- News Photo Box -->
    <rect x="18" y="9" width="13" height="8" rx="1.5" fill="#ffffff" fill-opacity="0.9" />
    
    <!-- Headline & Body text lines -->
    <line x1="18" y1="23" x2="31" y2="23" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />
    <line x1="18" y1="29" x2="27" y2="29" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />
  </g>
</svg>
