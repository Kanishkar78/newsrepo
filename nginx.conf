server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /news;
    index index.html;

    # Serve static frontend files and support clean URLs (/login, /article)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Proxy API calls to Node.js backend running on host port 3000
    location /api/ {
        proxy_pass http://host.docker.internal:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Return clear JSON error if backend is not running or down
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_gateway_error;
    }

    location @api_gateway_error {
        default_type application/json;
        return 502 '{"success":false,"error":"Backend API is offline or unreachable. Please ensure the backend server is running (npm start)."}';
    }

    # Error pages
    error_page 500 /50x.html;
    location = /50x.html {
        root /var/lib/nginx/html;
    }
}
